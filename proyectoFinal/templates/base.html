<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoFix - Gestión Integral</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: system-ui, sans-serif; }
        .sidebar { background-color: #1a1d24; min-height: 100vh; color: #fff; }
        .sidebar a { color: #a0aec0; text-decoration: none; display: block; padding: 14px 20px; border-left: 4px solid transparent; transition: all 0.2s; }
        .sidebar a:hover, .sidebar a.active { color: #fff; background-color: #2d3748; border-left-color: #0d6efd; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar p-0">
                <div class="p-4 bg-dark text-center"><h4 class="text-primary font-monospace m-0"><i class="bi bi-wrench-adjustable-circle-fill"></i> AutoFix</h4></div>
                <div class="mt-3">
                    <a href="{{ url_for('index') }}" class="{% if request.path == '/' %}active{% endif %}"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
                    <a href="{{ url_for('gestion_clientes') }}" class="{% if '/clientes' in request.path %}active{% endif %}"><i class="bi bi-people-fill me-2"></i> Clientes</a>
                    <a href="{{ url_for('gestion_vehiculos' or '/vehiculos' in request.path) }}" class="{% if '/vehiculos' in request.path %}active{% endif %}"><i class="bi bi-car-front-fill me-2"></i> Vehículos</a>
                    <a href="{{ url_for('gestion_servicios') }}" class="{% if '/servicios' in request.path %}active{% endif %}"><i class="bi bi-clipboard-data-fill me-2"></i> Servicios Activos</a>
                    <a href="{{ url_for('ver_historial') }}" class="{% if '/historial' in request.path %}active{% endif %}"><i class="bi bi-archive-fill me-2"></i> Historial de Caja</a>
                </div>
            </div>
            <div class="col-md-10 p-4">
                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm" role="alert">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
